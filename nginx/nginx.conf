# =========================================================================
# NGINX CONFIGURATION FOR URL SHORTENER LOAD BALANCING
# Role: Layer 7 Reverse Proxy & Load Balancer
# =========================================================================

# Global settings: Kitne worker processes run honge (auto = CPU cores ke barabar)
worker_processes auto;

# Event handling mechanism
events {
    # Har worker process kitne simultaneous connections handle kar sakta hai
    # 1024 connections per worker = high concurrency handling with low RAM
    worker_connections 1024;
}

http {
    # MIME types include karte hain (CSS, JS, JSON proper headers ke liye)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # High-performance static and network file transfer optimizations
    sendfile        on;
    keepalive_timeout  65;

    # =====================================================================
    # SYSTEM DESIGN CONCEPT: UPSTREAM CLUSTER (HORIZONTAL SCALING)
    # Nginx in dono backend container replicas ke beech requests distribute karega
    # Algorithm: Default Round-Robin (1st req -> api-1, 2nd req -> api-2)
    # =====================================================================
    upstream api_cluster {
        # Server Replica 1 (Docker network hostname 'api-1')
        server api-1:5000 max_fails=3 fail_timeout=10s;

        # Server Replica 2 (Docker network hostname 'api-2')
        server api-2:5000 max_fails=3 fail_timeout=10s;
    }

    # =====================================================================
    # VIRTUAL SERVER: Client Traffic Port 80 par receive karta hai
    # =====================================================================
    server {
        # Standard HTTP port
        listen 80;
        server_name localhost;

        # All incoming requests ko upstream backend cluster par forward karo
        location / {
            # Traffic ko upstream cluster (api-1 & api-2) par bhejo
            proxy_pass http://api_cluster;

            # HTTP version 1.1 use karo for connection pooling
            proxy_http_version 1.1;

            # Original client headers ko preserve karo taaki backend ko client ka real IP mile
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # =============================================================
            # INTERVIEW SHOWCASE TELEMETRY HEADER:
            # Ye header browser/client ko batayega ki request kis exact container
            # IP par serve hui (e.g., 172.x.x.2:5000 vs 172.x.x.3:5000)
            # Proof of live load balancing!
            # =============================================================
            add_header X-Handled-By $upstream_addr always;
        }
    }
}
